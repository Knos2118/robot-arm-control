<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Arm Control Panel</title>
    <!-- Tailwind CSS cho Giao diện -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc; /* Slate 50 */
        }
        .font-mono {
            font-family: 'Fira Code', monospace;
        }
        
        /* Custom Styling cho thanh trượt (Range Slider) */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #3b82f6; /* Blue 500 */
            cursor: pointer;
            margin-top: -10px;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            background: #60a5fa; /* Blue 400 */
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #334155; /* Slate 700 */
            border-radius: 3px;
        }
        input[type=range]:focus {
            outline: none;
        }
        
        /* Hiệu ứng đèn LED trạng thái */
        .led-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            box-shadow: 0 0 8px currentColor;
        }
        .status-disconnected { color: #ef4444; background-color: #ef4444; }
        .status-connected { color: #10b981; background-color: #10b981; }

        /* Cuộn cho terminal */
        .terminal-scroll {
            scrollbar-width: thin;
            scrollbar-color: #475569 #1e293b;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-4xl w-full bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 overflow-hidden flex flex-col md:flex-row">
        
        <!-- Cột Trái: Bảng điều khiển 2 Sliders -->
        <div class="flex-1 p-6 md:p-8 border-b md:border-b-0 md:border-r border-slate-700">
            <div class="flex justify-between items-center mb-8">
                <div>
                    <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">
                        ROBOT ARM UI
                    </h1>
                    <p class="text-slate-400 text-sm mt-1">Điều khiển 2 Servo (Base & Gripper) qua Bluetooth / Serial</p>
                </div>
            </div>

            <!-- Các thanh trượt điều khiển Servo -->
            <div class="space-y-6">
                <!-- Base -->
                <div class="slider-group">
                    <div class="flex justify-between mb-2">
                        <label for="baseSlider" class="font-medium text-slate-300">Đế Xoay (Base)</label>
                        <span id="baseVal" class="text-blue-400 font-mono font-bold bg-slate-900 px-2 py-1 rounded text-sm">90°</span>
                    </div>
                    <input type="range" id="baseSlider" min="0" max="180" value="90" oninput="updateSliders()">
                </div>

                <!-- Gripper -->
                <div class="slider-group">
                    <div class="flex justify-between mb-2">
                        <label for="gripperSlider" class="font-medium text-slate-300">Kẹp Vật (Gripper)</label>
                        <span id="gripperVal" class="text-blue-400 font-mono font-bold bg-slate-900 px-2 py-1 rounded text-sm">90°</span>
                    </div>
                    <input type="range" id="gripperSlider" min="0" max="180" value="90" oninput="updateSliders()">
                </div>
            </div>
            
            <div class="mt-8 flex gap-4">
                <button onclick="resetSliders()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-semibold py-2 px-4 rounded-lg transition duration-200">
                    Reset Vị Trí (90°)
                </button>
            </div>
        </div>

        <!-- Cột Phải: Trạng thái & Terminal -->
        <div class="w-full md:w-80 bg-slate-900 p-6 md:p-8 flex flex-col">
            <h2 class="text-lg font-semibold mb-4 text-slate-200 border-b border-slate-700 pb-2">Kết nối (Serial)</h2>
            
            <div class="mb-6">
                <div class="flex items-center mb-4 bg-slate-800 p-3 rounded-lg border border-slate-700">
                    <div id="statusLed" class="led-indicator status-disconnected"></div>
                    <span id="statusText" class="font-medium text-slate-300">Đã ngắt kết nối</span>
                </div>
                
                <button id="connectBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg shadow-lg transition duration-200 flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-8.707l-3-3a1 1 0 00-1.414 0l-3 3a1 1 0 001.414 1.414L9 9.414V13a1 1 0 102 0V9.414l1.293 1.293a1 1 0 001.414-1.414z" clip-rule="evenodd" />
                    </svg>
                    Kết nối Robot (COM)
                </button>
            </div>

            <div class="flex-1 flex flex-col min-h-[200px]">
                <h3 class="text-sm font-semibold text-slate-400 mb-2">Terminal / Lệnh vừa gửi</h3>
                <div class="flex-1 bg-black rounded-lg border border-slate-700 p-3 font-mono text-xs overflow-y-auto terminal-scroll flex flex-col justify-end">
                    <div id="terminal" class="space-y-1 text-slate-300">
                        <div class="text-slate-500">Khởi tạo hệ thống...</div>
                        <div class="text-slate-500">Chờ kết nối Web Serial API...</div>
                    </div>
                </div>
            </div>
            
            <div class="mt-4 text-xs text-slate-500 text-center">
                Yêu cầu trình duyệt Chrome/Edge hỗ trợ Web Serial API.
            </div>
        </div>
    </div>

    <script>
        // DOM Elements cho 2 Servo
        const sliders = {
            base: document.getElementById('baseSlider'),
            gripper: document.getElementById('gripperSlider')
        };
        const displays = {
            base: document.getElementById('baseVal'),
            gripper: document.getElementById('gripperVal')
        };
        const btnConnect = document.getElementById('connectBtn');
        const statusLed = document.getElementById('statusLed');
        const statusText = document.getElementById('statusText');
        const terminal = document.getElementById('terminal');

        let port;
        let writer;
        let isConnected = false;

        if (!("serial" in navigator)) {
            logToTerminal("LỖI: Trình duyệt không hỗ trợ Web Serial API. Dùng Chrome/Edge trên PC.", "error");
            btnConnect.disabled = true;
            btnConnect.classList.add("opacity-50", "cursor-not-allowed");
        }

        btnConnect.addEventListener('click', async () => {
            if (isConnected) {
                await disconnectSerial();
            } else {
                await connectSerial();
            }
        });

        async function connectSerial() {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 9600 });
                
                const textEncoder = new TextEncoderStream();
                const writableStreamClosed = textEncoder.readable.pipeTo(port.writable);
                writer = textEncoder.writable.getWriter();

                isConnected = true;
                updateUIConnected();
                logToTerminal("Đã kết nối thành công với Robot!", "success");
                
                sendRobotCommand();
                port.addEventListener('disconnect', disconnectSerial);

            } catch (error) {
                console.error("Lỗi kết nối:", error);
                logToTerminal("Lỗi kết nối: " + error.message, "error");
            }
        }

        async function disconnectSerial() {
            if (writer) {
                await writer.close();
                writer = null;
            }
            if (port) {
                await port.close();
                port = null;
            }
            isConnected = false;
            updateUIDisconnected();
            logToTerminal("Đã ngắt kết nối.", "warning");
        }

        function updateUIConnected() {
            btnConnect.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
                </svg>
                Ngắt kết nối
            `;
            btnConnect.classList.remove('bg-blue-600', 'hover:bg-blue-500');
            btnConnect.classList.add('bg-red-600', 'hover:bg-red-500');
            
            statusLed.classList.remove('status-disconnected');
            statusLed.classList.add('status-connected');
            statusText.textContent = "Đã kết nối";
            statusText.classList.replace('text-slate-300', 'text-emerald-400');
        }

        function updateUIDisconnected() {
            btnConnect.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-8.707l-3-3a1 1 0 00-1.414 0l-3 3a1 1 0 001.414 1.414L9 9.414V13a1 1 0 102 0V9.414l1.293 1.293a1 1 0 001.414-1.414z" clip-rule="evenodd" />
                </svg>
                Kết nối Robot (COM)
            `;
            btnConnect.classList.remove('bg-red-600', 'hover:bg-red-500');
            btnConnect.classList.add('bg-blue-600', 'hover:bg-blue-500');
            
            statusLed.classList.remove('status-connected');
            statusLed.classList.add('status-disconnected');
            statusText.textContent = "Đã ngắt kết nối";
            statusText.classList.replace('text-emerald-400', 'text-slate-300');
        }

        // Cập nhật giá trị 2 slider
        function updateSliders() {
            const vBase = sliders.base.value;
            const vGripper = sliders.gripper.value;

            displays.base.textContent = vBase + '°';
            displays.gripper.textContent = vGripper + '°';

            sendRobotCommand(vBase, vGripper);
        }

        // Reset cả 2 slider về 90°
        function resetSliders() {
            sliders.base.value = 90;
            sliders.gripper.value = 90;
            updateSliders();
        }

        let isWriting = false; 

        // Gửi chuỗi dạng: "Base,Gripper\n"
        async function sendRobotCommand(b = sliders.base.value, g = sliders.gripper.value) {
            if (!isConnected || !writer) return;
            if (isWriting) return;

            isWriting = true;
            const commandString = `${b},${g}\n`;
            
            try {
                await writer.write(commandString);
                logToTerminal(`> Gửi: ${commandString.trim()}`, "info");
            } catch (error) {
                console.error("Lỗi khi ghi dữ liệu:", error);
                logToTerminal("Lỗi ghi: " + error.message, "error");
            } finally {
                isWriting = false;
            }
        }

        function logToTerminal(message, type = "info") {
            const div = document.createElement('div');
            const now = new Date();
            const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
            
            let colorClass = "text-slate-300";
            if (type === "error") colorClass = "text-red-400";
            if (type === "success") colorClass = "text-emerald-400";
            if (type === "warning") colorClass = "text-yellow-400";
            if (type === "info") colorClass = "text-blue-300";

            div.className = colorClass;
            div.innerHTML = `<span class="text-slate-600">[${timeStr}]</span> ${message}`;
            
            terminal.appendChild(div);
            
            const terminalContainer = terminal.parentElement;
            terminalContainer.scrollTop = terminalContainer.scrollHeight;

            while (terminal.children.length > 15) {
                terminal.removeChild(terminal.firstChild);
            }
        }
    </script>
</body>
</html>
